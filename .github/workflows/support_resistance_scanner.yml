name: Support and Resistance Scanner

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      indexes:
        description: "Index universes to scan"
        required: true
        default: "sp500 nasdaq100"
        type: string

permissions:
  contents: read

concurrency:
  group: support-resistance-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: support-resistence-scanner/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r support-resistence-scanner/requirements.txt

      - name: Run scanner tests
        run: python -m unittest discover -s support-resistence-scanner/tests -v

      - name: Run support/resistance scan
        env:
          SCAN_INDEXES: ${{ inputs.indexes || 'sp500 nasdaq100' }}
        run: |
          python support-resistence-scanner/support_resistance_scanner.py \
            --indexes $SCAN_INDEXES \
            --output support-resistence-scanner/support_resistance_signals.csv

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: support-resistance-signals-${{ github.run_id }}
          path: support-resistence-scanner/support_resistance_signals.csv
          if-no-files-found: error
          retention-days: 30
