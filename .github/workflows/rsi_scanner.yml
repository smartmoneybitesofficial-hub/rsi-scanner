name: RSI Scanner

on:
  schedule:
    - cron: '0 8 * * 1-5'     # every weekday at ~9AM CET
  workflow_dispatch:

permissions:
  contents: write   # REQUIRED for pushing

jobs:
  run_scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas tabulate colorama

      - name: Run RSI Scanner
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python rsi_scanner.py

      - name: Commit and Push signals.csv
        shell: bash
        run: |
          set -e

          git config --local user.email "smartmoneybites.official@gmail.com"
          git config --local user.name "smartmoneybitesofficial-hub"

          git add signals.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update RSI signals [skip ci]"

          git fetch origin "${GITHUB_REF_NAME}"
          git pull --rebase origin "${GITHUB_REF_NAME}"

          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
