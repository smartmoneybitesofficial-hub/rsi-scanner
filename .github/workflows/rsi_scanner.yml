name: RSI Scanner

on:
  schedule:
    - cron: '0 8 * * 1-5'     # every weekday at ~9AM CET
  workflow_dispatch:

concurrency:
  group: rsi-scanner-main
  cancel-in-progress: true

permissions:
  contents: write   # REQUIRED for pushing

jobs:
  run_scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Synchronize with main
        shell: bash
        run: |
          set -e
          git config --local user.email "smartmoneybites.official@gmail.com"
          git config --local user.name "smartmoneybitesofficial-hub"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas tabulate colorama

      - name: Run RSI Scanner
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python rsi_scanner.py

      - name: Commit and Push scanner data
        shell: bash
        run: |
          set -e

          git add signals.csv signal_followup.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update RSI signals [skip ci]"
          git push origin main
