name: RSI Scanner

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write   # REQUIRED for pushing

jobs:
  run_scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas tabulate colorama

      - name: Run RSI Scanner
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python rsi_scanner.py

      - name: Commit and Push signals.csv
        run: |
          git config --local user.email "smartmoneybites.official@gmail.com"
          git config --local user.name "smartmoneybitesofficial-hub"
          git add signals.csv
          git commit -m "Update RSI signals [skip ci]" || echo "No changes"

          # Use authenticated remote
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin HEAD:${{ github.ref_name }}
